<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Wedding Upload</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Raleway:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Raleway', sans-serif;
      background-color: #000;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      text-align: center;
      max-width: 480px;
      width: 90%;
      padding: 40px 30px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      margin-bottom: 25px;
    }

    /* Hide default file input */
    #fileInput {
      display: none;
    }

    /* Cloud upload icon button */
    .cloud-upload {
      width: 90px;
      height: 90px;
      border-radius: 20px;
      background: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      margin: 0 auto;
      transition: 0.3s;
      border: 2px solid #555;
    }

    .cloud-upload:hover {
      background: #2a2a2a;
      transform: scale(1.05);
    }

    /* Cloud icon SVG styling */
    .cloud-upload svg {
      width: 50px;
      height: 50px;
      fill: #bbb; /* soft wedding gray */
    }

    #selectedFileName {
      margin-top: 12px;
      font-size: 0.95rem;
      color: #ccc;
      font-style: italic;
    }

    button {
      background: #444;
      color: #fff;
      border: 2px solid #fff;
      padding: 14px 32px;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 20px;
    }

    button:hover {
      background: #666;
      transform: scale(1.05);
    }

    #status {
      margin-top: 25px;
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="container">

    <h1>Upload Your Photo or Video</h1>

    <!-- Hidden Input -->
    <input type="file" id="fileInput" accept="image/*,video/*">

    <!-- Cloud upload button -->
    <div class="cloud-upload" id="chooseBtn">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M19 18H6a4 4 0 010-8 5.5 5.5 0 0110.9-1A4.5 4.5 0 0119 18zm-7-9l-4 4h3v4h2v-4h3l-4-4z"/>
      </svg>
    </div>

    <div id="selectedFileName"></div>

    <button id="uploadBtn">Upload</button>

    <div id="status"></div>

  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxqUTY6km0cG5YmRewPe4XMe6gcMTprwVnx6UwEy695wsG_baG7-y98XR-e1M_VZKOf/exec";

    const chooseBtn = document.getElementById("chooseBtn");
    const fileInput = document.getElementById("fileInput");
    const selectedFileName = document.getElementById("selectedFileName");
    const uploadBtn = document.getElementById("uploadBtn");
    const status = document.getElementById("status");

    chooseBtn.addEventListener("click", () => fileInput.click());

    fileInput.addEventListener("change", () => {
      selectedFileName.textContent = fileInput.files.length
        ? fileInput.files[0].name
        : "";
    });

    uploadBtn.addEventListener("click", () => {
      const file = fileInput.files[0];
      if (!file) {
        status.textContent = "Please select a file.";
        return;
      }

      uploadBtn.disabled = true;
      uploadBtn.textContent = "Uploading...";

      const reader = new FileReader();
      reader.onload = function(e) {
        const base64 = e.target.result.split(",")[1];

        fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            fileName: file.name,
            mimeType: file.type,
            base64File: base64
          })
        })
        .then(res => res.json())
        .then(data => {
          if (data.status === "success") {
            fileInput.value = "";
            selectedFileName.textContent = "";
            status.textContent = "Thank you!";
          } else {
            status.textContent = `Upload failed: ${data.message}`;
          }
        })
        .catch(err => {
          status.textContent = `Upload failed: ${err}`;
        })
        .finally(() => {
          uploadBtn.disabled = false;
          uploadBtn.textContent = "Upload";
        });
      };

      reader.readAsDataURL(file);
    });
  </script>

</body>
</html>
