<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wedding Uploader</title>

  <!-- Elegant Script Font -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #000;
      color: #fff;
      font-family: 'Playfair Display', serif;
    }

    .container {
      text-align: center;
      max-width: 450px;
      width: 90%;
      padding: 40px 30px;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 25px;
      font-weight: 700;
    }

    input[type="file"] {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border: none;
      border-radius: 8px;
      background-color: #111;
      color: #fff;
      font-size: 1rem;
    }

    button {
      width: 100%;
      padding: 14px;
      background-color: #666;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:disabled {
      background-color: #444;
      cursor: not-allowed;
    }

    button:hover:not(:disabled) {
      background-color: #555;
    }

    #status {
      margin-top: 10px;
      font-size: 1rem;
      font-weight: 400;
    }

    #preview {
      margin-top: 15px;
      max-width: 100%;
      max-height: 200px;
      border-radius: 8px;
      display: none;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Upload Your Photo/Video</h1>
    <input type="file" id="fileInput" accept="image/*,video/*">
    <button id="uploadBtn">Upload</button>
    <div id="status"></div>
    <div>
      <img id="preview" alt="Preview">
      <video id="previewVideo" controls style="max-width:100%; max-height:200px; display:none;"></video>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxqUTY6km0cG5YmRewPe4XMe6gcMTprwVnx6UwEy695wsG_baG7-y98XR-e1M_VZKOf/exec";

    const fileInput = document.getElementById("fileInput");
    const uploadBtn = document.getElementById("uploadBtn");
    const status = document.getElementById("status");
    const previewImg = document.getElementById("preview");
    const previewVideo = document.getElementById("previewVideo");

    fileInput.addEventListener("change", () => {
      const file = fileInput.files[0];
      if (!file) {
        previewImg.style.display = "none";
        previewVideo.style.display = "none";
        return;
      }

      const url = URL.createObjectURL(file);
      if (file.type.startsWith("image/")) {
        previewImg.src = url;
        previewImg.style.display = "block";
        previewVideo.style.display = "none";
      } else if (file.type.startsWith("video/")) {
        previewVideo.src = url;
        previewVideo.style.display = "block";
        previewImg.style.display = "none";
      }
    });

    uploadBtn.addEventListener("click", () => {
      const file = fileInput.files[0];
      if (!file) {
        status.textContent = "Please select a file.";
        return;
      }

      uploadBtn.disabled = true;
      uploadBtn.textContent = "Uploading...";
      status.textContent = "";

      const reader = new FileReader();
      reader.onload = function(e) {
        const base64 = e.target.result.split(",")[1];

        fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            fileName: file.name,
            mimeType: file.type,
            base64File: base64
          })
        })
        .then(res => res.json())
        .then(data => {
          if (data.status === "success") {
            fileInput.value = "";
            status.textContent = "Thank you!";
            previewImg.style.display = "none";
            previewVideo.style.display = "none";
          } else {
            status.textContent = `Upload failed: ${data.message}`;
          }
        })
        .catch(err => {
          status.textContent = `Upload failed: ${err}`;
        })
        .finally(() => {
          uploadBtn.disabled = false;
          uploadBtn.textContent = "Upload";
        });
      };

      reader.readAsDataURL(file);
    });
  </script>

</body>
</html>
