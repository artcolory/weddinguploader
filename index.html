<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wedding Photo & Video Uploader</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Raleway:wght@400;600&display=swap" rel="stylesheet">

<style>
  body {
    font-family: 'Raleway', sans-serif;
    background: #000;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }

  .container {
    text-align: center;
    max-width: 480px;
    width: 90%;
    padding: 40px 30px;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    margin-bottom: 25px;
  }

  input, button {
    font-size: 1rem;
    margin: 6px 0;
    padding: 12px;
    border-radius: 8px;
    border: none;
    box-sizing: border-box;
  }

  button {
    cursor: pointer;
    background: #444;
    color: #fff;
    border: 2px solid #fff;
  }

  button:hover {
    background: #666;
  }

  /* Gray elegant input */
  #brideId {
    color: #ccc;
    background: #111;
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 2px solid #555;
  }

  small {
    display: block;
    margin-bottom: 12px;
    color: #bbb;
    font-size: 0.9rem;
  }

  /* Cloud button */
  .cloud-upload {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: #111;
    border: 2px solid #555;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    margin: 20px auto;
    transition: 0.3s;
  }

  .cloud-upload:hover {
    background: #333;
  }

  .cloud-upload svg {
    width: 42px;
    height: 42px;
    fill: #ccc;
  }

  #preview img,
  #preview video {
    max-width: 220px;
    border-radius: 12px;
    margin-top: 12px;
  }

  #status {
    margin-top: 20px;
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    font-weight: 600;
  }

  #guestLink {
    margin-top: 28px;
  }

  #guestUrl {
    margin-top: 10px;
    font-size: 1.1rem;
    color: #ccc;
    word-break: break-all;
  }

  .hidden { display: none; }
</style>
</head>

<body>
<div class="container">

<h1>Wedding Photo & Video Uploader</h1>

<!-- Step 1 -->
<input type="text" id="brideId" placeholder="Enter your names + wedding date (e.g., AliceBob042026)">
<small>Use your first names and wedding date to create a unique folder.</small>
<button id="createFolderBtn">Create Folder</button>

<!-- Step 2 -->
<div id="uploadDiv" class="hidden">
  <div class="cloud-upload" id="chooseBtn">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
      <path d="M19 18H6a4 4 0 010-8 5.5 5.5 0 0110.9-1A4.5 4.5 0 0119 18zm-7-9l-4 4h3v4h2v-4h3l-4-4z"/>
    </svg>
  </div>

  <input type="file" id="fileInput" accept="image/*,video/*" class="hidden">
  <button id="uploadBtn" class="hidden">Upload Photo</button>

  <div id="preview"></div>
</div>

<div id="status"></div>

<!-- Guest link -->
<div id="guestLink" class="hidden">
  <small>Copy this website link and attach it to your Photo Upload Button inside your Canva Website:</small>
  <div id="guestUrl"></div>
</div>

</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzbqJLpjM-1vTlZcVxgVKTPaoSxhRFUsER374G1rxqm1Kt8rQQ3ryLAXhjSuPSQ5_sKXA/exec";

const brideInput = document.getElementById("brideId");
const createFolderBtn = document.getElementById("createFolderBtn");
const uploadDiv = document.getElementById("uploadDiv");
const chooseBtn = document.getElementById("chooseBtn");
const fileInput = document.getElementById("fileInput");
const uploadBtn = document.getElementById("uploadBtn");
const preview = document.getElementById("preview");
const status = document.getElementById("status");
const guestLink = document.getElementById("guestLink");
const guestUrl = document.getElementById("guestUrl");

/* STEP 1 — Create Folder */
createFolderBtn.addEventListener("click", () => {
  const brideId = brideInput.value.trim();
  if (!brideId) {
    status.textContent = "Please enter your folder name.";
    return;
  }

  createFolderBtn.disabled = true;
  createFolderBtn.textContent = "Creating...";

  fetch(SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({
      mode: "createFolder",  // IMPORTANT FIX
      brideId: brideId
    })
  })
  .then(r => r.json())
  .then(d => {
    if (d.status === "success") {
      status.textContent = `Folder "${brideId}" created! Now upload your first welcome photo.`;
      uploadDiv.classList.remove("hidden");
    }
    else if (d.status === "exists") {
      status.textContent = `This folder name already exists. Please create a different one.`;
    }
    else {
      status.textContent = "Error: " + d.message;
    }
  })
  .catch(err => status.textContent = "Error: " + err)
  .finally(() => {
    createFolderBtn.disabled = false;
    createFolderBtn.textContent = "Create Folder";
  });
});

/* STEP 2 — Choose file */
chooseBtn.addEventListener("click", () => fileInput.click());

fileInput.addEventListener("change", () => {
  const file = fileInput.files[0];
  if (!file) return;

  const url = URL.createObjectURL(file);
  preview.innerHTML =
    file.type.startsWith("image/")
      ? `<img src="${url}">`
      : `<video src="${url}" autoplay muted loop></video>`;

  uploadBtn.classList.remove("hidden");
});

/* STEP 3 — Upload file */
uploadBtn.addEventListener("click", () => {
  const brideId = brideInput.value.trim();
  const file = fileInput.files[0];

  if (!file) {
    status.textContent = "Please select a file first.";
    return;
  }

  uploadBtn.disabled = true;
  uploadBtn.textContent = "Uploading...";

  const reader = new FileReader();
  reader.onload = e => {
    const base64 = e.target.result.split(",")[1];

    fetch(SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        mode: "uploadFile",   // IMPORTANT FIX
        brideId: brideId,
        fileName: file.name,
        mimeType: file.type,
        base64File: base64
      })
    })
    .then(r => r.json())
    .then(d => {
      if (d.status === "success") {
        preview.innerHTML = "";
        fileInput.value = "";
        uploadBtn.classList.add("hidden");

        status.textContent =
          "Congratulations! You have uploaded your photo! Look in Google Drive for your folder name to view it.";

        guestLink.classList.remove("hidden");
        guestUrl.textContent =
          `https://artcolory.github.io/weddinguploader/guest.html?folder=${brideId}`;
      } else {
        status.textContent = "Upload failed: " + d.message;
      }
    })
    .catch(err => status.textContent = "Upload failed: " + err)
    .finally(() => {
      uploadBtn.disabled = false;
      uploadBtn.textContent = "Upload Photo";
    });
  };

  reader.readAsDataURL(file);
});
</script>
</body>
</html>
