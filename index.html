<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wedding Photo & Video Uploader</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Raleway:wght@400;600&display=swap" rel="stylesheet">
<style>
  body { font-family:'Raleway',sans-serif; background:#000; color:#fff; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; }
  .container { text-align:center; max-width:480px; width:90%; padding:40px 30px; }
  h1 { font-family:'Playfair Display', serif; font-size:2rem; margin-bottom:25px; }

  /* Bride ID input (setup only) */
  input[type="text"] {
    font-size:1rem;
    margin:10px 0;
    padding:10px;
    border-radius:8px;
    border:none;
    background:#333;
    color:#bbb;
    width:90%;
  }

  /* Cloud upload button */
  #fileInput { display:none; }
  .cloud-upload {
    width:110px;
    height:110px;
    border-radius:50%;
    background:#555;
    display:flex;
    justify-content:center;
    align-items:center;
    cursor:pointer;
    margin:0 auto;
    transition:0.3s;
    border:2px solid #777;
  }
  .cloud-upload:hover { background:#666; transform:scale(1.05); }
  .cloud-upload svg { width:55px; height:55px; fill:#ddd; }

  #preview { margin-top:15px; }
  #preview img,#preview video { max-width:200px; border-radius:12px; margin-top:10px; }

  button {
    background:#444; color:#fff; border:2px solid #fff; padding:14px 32px; border-radius:12px;
    font-size:1.1rem; font-weight:600; cursor:pointer; transition:0.3s; margin-top:20px;
  }
  button:hover { background:#666; transform:scale(1.05); }

  #status { margin-top:25px; font-family:'Playfair Display', serif; font-size:1.3rem; font-weight:600; }
  small { display:block; margin-bottom:10px; color:#ccc; font-size:0.9rem; }
</style>
</head>
<body>

<div class="container">
  <h1>Wedding Photo & Video Uploader</h1>

  <!-- Setup mode elements -->
  <div id="setupDiv">
    <input type="text" id="brideId" placeholder="Enter your names and wedding date (e.g., sophiaben04122026)">
    <small>Use your first names and wedding date to create a unique folder for your photos/videos.</small>
  </div>

  <!-- Cloud file chooser -->
  <div class="cloud-upload" id="chooseBtn">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
      <path d="M19 18H6a4 4 0 010-8 5.5 5.5 0 0110.9-1A4.5 4.5 0 0119 18zm-7-9l-4 4h3v4h2v-4h3l-4-4z"/>
    </svg>
  </div>
  <input type="file" id="fileInput" accept="image/*,video/*">

  <!-- Preview -->
  <div id="preview"></div>

  <!-- Upload button -->
  <button id="uploadBtn">Upload</button>

  <!-- Status -->
  <div id="status"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby22tI-7iO5Qb78tegrBWOm0BiOO2y6C_FsC6v1qWgc6eZVDItJPd23yVwTA8It-ZS2KQ/exec";

const setupDiv = document.getElementById("setupDiv");
const brideInput = document.getElementById("brideId");
const chooseBtn = document.getElementById("chooseBtn");
const fileInput = document.getElementById("fileInput");
const preview = document.getElementById("preview");
const uploadBtn = document.getElementById("uploadBtn");
const status = document.getElementById("status");

// Determine setup mode from URL param (setup=true)
const urlParams = new URLSearchParams(window.location.search);
const setupMode = urlParams.get('setup') === 'true';

// Show/hide setup input
if(!setupMode) { setupDiv.style.display = 'none'; }

// Cloud click opens file chooser
chooseBtn.addEventListener("click", ()=>fileInput.click());

// Preview file
fileInput.addEventListener("change", ()=>{
  const file = fileInput.files[0];
  if(!file){ preview.innerHTML=""; return; }
  const url = URL.createObjectURL(file);
  preview.innerHTML = file.type.startsWith("image/") ? `<img src="${url}">` : `<video src="${url}" muted autoplay loop></video>`;
});

// Upload
uploadBtn.addEventListener("click", ()=>{
  const brideId = setupMode ? brideInput.value.trim() : "guest"; // guest mode uses generic folder if needed
  const file = fileInput.files[0];

  if(setupMode && !brideId){ status.textContent="Please enter your names and wedding date"; return; }
  if(!file){ status.textContent="Please select a file"; return; }

  uploadBtn.disabled=true;
  uploadBtn.textContent="Uploading...";

  const reader = new FileReader();
  reader.onload=function(e){
    const base64 = e.target.result.split(",")[1];

    fetch(SCRIPT_URL,{
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({
        fileName:file.name,
        mimeType:file.type,
        base64File:base64,
        brideId:brideId
      })
    })
    .then(res=>res.json())
    .then(data=>{
      if(data.status==="success"){
        fileInput.value="";
        preview.innerHTML="";
        if(setupMode){
          status.textContent=`Folder "${brideId}" created! Go to Google Drive and copy the link to share with guests.`;
        } else {
          status.textContent="Thank you! Upload successful.";
        }
      } else {
        status.textContent=`Upload failed: ${data.message}`;
      }
    })
    .catch(err=>{
      status.textContent=`Upload failed: ${err}`;
    })
    .finally(()=>{
      uploadBtn.disabled=false;
      uploadBtn.textContent="Upload";
    });
  };
  reader.readAsDataURL(file);
});
</script>

</body>
</html>
