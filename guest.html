<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guest Photo/Video Upload</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Raleway:wght@400;600&display=swap" rel="stylesheet">
<style>
body { font-family:'Raleway',sans-serif; background:#000; color:#fff; padding:30px; text-align:center; }
h1 { font-family:'Playfair Display',serif; font-size:2rem; margin-bottom:20px; }

/* Cloud upload button */
.cloud-upload { width:110px; height:110px; border-radius:50%; background:rgba(255,255,255,0.08); border:2px solid rgba(255,255,255,0.25); display:flex; justify-content:center; align-items:center; margin:0 auto 30px auto; cursor:pointer; transition:0.3s; }
.cloud-upload:hover { background: rgba(255,255,255,0.18); }
.cloud-upload svg { width:60px; fill:#ccc; }
#guestFileInput { display:none; }

/* Upload button */
#guestUploadBtn { margin-top:30px; padding:14px 28px; background:#222; color:#fff; border:2px solid #fff; border-radius:12px; font-size:1.1rem; cursor:pointer; transition:0.3s; }
#guestUploadBtn:hover { background:#444; }

/* Preview */
#guestPreview { margin-top:40px; }
#guestPreview img,#guestPreview video { max-width:240px; border-radius:12px; }

/* Status */
#guestStatus { margin-top:50px; font-family:'Playfair Display',serif; font-size:1.15rem; }
</style>
</head>
<body>

<h1>Upload Your Photo or Video</h1>

<div class="cloud-upload" id="guestChooseBtn">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
    <path d="M19 18H6a4 4 0 010-8 5.5 5.5 0 0110.9-1A4.5 4.5 0 0119 18zm-7-9l-4 4h3v4h2v-4h3l-4-4z"/>
  </svg>
</div>

<input type="file" id="guestFileInput" accept="image/*,video/*">
<button id="guestUploadBtn">Upload</button>

<div id="guestPreview"></div>
<div id="guestStatus"></div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzuv_-YOZiDI2BI38fzVjckt5BtCK3rDE5TH-FiUsIPL9ek_xSwDTzfG8QCPzCbtIY6PA/exec";

// Folder from URL
const urlParams = new URLSearchParams(window.location.search);
const brideFolder = urlParams.get("folder");

const guestChooseBtn = document.getElementById("guestChooseBtn");
const guestFileInput = document.getElementById("guestFileInput");
const guestUploadBtn = document.getElementById("guestUploadBtn");
const guestPreview = document.getElementById("guestPreview");
const guestStatus = document.getElementById("guestStatus");

// Open file picker
guestChooseBtn.addEventListener("click", () => guestFileInput.click());

// Preview selected file
guestFileInput.addEventListener("change", () => {
  const f = guestFileInput.files[0];
  if(!f) return guestPreview.innerHTML = "";
  const url = URL.createObjectURL(f);
  guestPreview.innerHTML = f.type.startsWith("image/") ? `<img src="${url}">` : `<video src="${url}" autoplay muted loop></video>`;
});

// Upload file
guestUploadBtn.addEventListener("click", () => {
  const file = guestFileInput.files[0];
  if(!file) return guestStatus.textContent = "Please select a file.";

  guestUploadBtn.disabled = true;
  guestUploadBtn.textContent = "Uploading...";

  const reader = new FileReader();
  reader.onload = e => {
    const base64 = e.target.result.split(",")[1];

    fetch(SCRIPT_URL, {
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({
        mode:"upload",
        fileName:file.name,
        mimeType:file.type,
        base64File:base64,
        brideId:brideFolder
      })
    })
    .then(r => r.json())
    .then(d => {
      if(d.status==="success"){
        guestStatus.textContent = "Thank you! Your upload was successful.";
        guestPreview.innerHTML = "";
        guestFileInput.value = "";
      } else {
        guestStatus.textContent = "Upload failed: " + d.message;
      }
    })
    .catch(err => guestStatus.textContent = "Upload failed: " + err)
    .finally(()=>{
      guestUploadBtn.disabled=false;
      guestUploadBtn.textContent="Upload";
    });
  };

  reader.readAsDataURL(file);
});
</script>

</body>
</html>
